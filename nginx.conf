# KIVENTIS – Container-Nginx (Traefik terminiert TLS)
#
# Struktur:
#   /                  neue statische Startseite (vorgerendert, 0 KB JS)
#   /en/               englische Startseite
#   /impressum.html    Rechtliches
#   /datenschutz.html  Rechtliches
#   /llms.txt          Faktenbasis für KI-Crawler
#   /assets/           Styles, Schriften, Screenshots der neuen Seite
#   /beispiele/        Demo-Seiten (zwei Export-Pipelines statisch)
#   /app.html          React-App als Fallback für eigene Routen
#   /app/              gehashte App-Bundles (vite base: /app/)
#
# CSP-Strategie:
#   Statische Seiten: strikt (alles 'self', ein JSON-LD-Hash).
#   App-Routen (location /): die App nutzt externe Fonts, Analytics
#   und Inline-Scripts – dafür gilt eine eigene, app-taugliche CSP.
#   add_header vererbt sich nicht an Locations mit eigenem add_header;
#   add_header_inherit merge stellt sicher, dass die Security-Header
#   (im server-Kontext) überall mitgesendet werden.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Traefik terminiert TLS und reicht per HTTP weiter. Relative
    # Redirects bleiben auf https, statt eine http-Kette zu bauen.
    absolute_redirect off;

    # ---------- Sprachen ----------
    # ?lang=en (auch ?lang=EN) auf die englische Startseite leiten.
    # if/return ist im server-Kontext erlaubt; map wäre hier nicht
    # möglich (conf.d umfasst nur den server-Kontext).
    if ($arg_lang = "en") {
        return 301 /en/;
    }
    if ($arg_lang = "EN") {
        return 301 /en/;
    }

    # ---------- Security-Header (für alle Locations) ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header_inherit merge;

    # ---------- Statische Startseiten ----------
    # CSP: alles von derselben Herkunft. Der Hash erlaubt ausschließlich
    # den JSON-LD-Block der Startseite. Neu berechnen nach Änderungen:
    #   python3 - <<'EOF'
    #   import re,hashlib,base64
    #   s=open('index.html').read()
    #   m=re.search(r'<script type="application/ld\+json">(.*?)</script>',s,re.S)
    #   print(base64.b64encode(hashlib.sha256(m.group(1).encode()).digest()).decode())
    #   EOF
    set $csp_static "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self' 'sha256-KmGt3ccqXvl19Kr88wzp5/6OHZkP2uXPfPe6N7i2poo=' https://analytics.kiventis.com; connect-src 'self' https://analytics.kiventis.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'";

    location = / {
        try_files /index.html =404;
        add_header Content-Security-Policy $csp_static always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location = /en/ {
        try_files /en/index.html =404;
        add_header Content-Security-Policy $csp_static always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location = /impressum.html {
        try_files /impressum.html =404;
        add_header Content-Security-Policy $csp_static always;
    }
    location = /datenschutz.html {
        try_files /datenschutz.html =404;
        add_header Content-Security-Policy $csp_static always;
    }
    location = /llms.txt {
        try_files /llms.txt =404;
    }

    # ---------- Demo-Seiten (statisch) ----------
    location = /beispiele/ {
        try_files /beispiele/index.html =404;
        add_header Content-Security-Policy $csp_static always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location ^~ /beispiele/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }
    location ^~ /beispiele/fi-rfbibl00/ {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy $csp_static always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location ^~ /beispiele/preise-konditionen/ {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy $csp_static always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ---------- Assets ----------
    # Schriften der statischen Seite
    location ^~ /assets/fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    # Bilder, Styles, Schriften der statischen Seite
    location ~* ^/assets/.*\.(svg|png|jpg|webp|woff2|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
    # Gehashte App-Bundle: ein Jahr unveränderlich
    location ^~ /app/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---------- Gzip ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ---------- React-App (SPA-Fallback) ----------
    # Alles, was keine Datei und keine bekannte Route ist, geht an die App:
    # /beispiele/bom-designer, /wissen/..., /insights/... und alle
    # künftigen SPA-Routen. Die App-Startseite ist app.html.
    #
    # CSP für App-Routen: die React-App lädt externe Schriftarten,
    # Analytics und greift auf einen Geo-IP-Dienst zu; Inline-Scripts
    # im App-Entry sind Bestandteil des Vite-Builds.
    location / {
        try_files $uri $uri/index.html $uri/ /app.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.kiventis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.country.is https://analytics.kiventis.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
