# =============================================================================
# KIVENTIS – nginx-Konfiguration für die statische Startseite
#
# Ziel
#   1. Die neue Startseite unter "/" ausliefern (vorgerendertes HTML, 0 KB JS).
#   2. Die bestehende React-App als Fallback für alle übrigen Routen erhalten
#      (z. B. /wissen/..., Insights-Artikel) – sie bleibt unter /app.html.
#   3. ?lang=en dauerhaft auf /en/ umleiten, statt dieselbe Seite doppelt
#      auszuliefern.
#
# Deployment
#   a) Bisheriges index.html nach app.html umbenennen (Backup: index.spa.html).
#   b) Dateien aus kiventis-relaunch/ ins Webroot kopieren:
#        index.html, en/index.html, impressum.html, datenschutz.html,
#        assets/styles.css, assets/fonts.css, assets/fonts/*, assets/*.svg
#        favicon.svg
#      Achtung: assets/ enthält bereits die gehashten Bundles der App
#      (index-XXXX.js). Die Dateinamen kollidieren nicht.
#   c) nginx -t && systemctl reload nginx
#
# Rollback
#   app.html wieder zu index.html umbenennen und den Block "Statische
#   Startseite" entfernen.
# =============================================================================

# --- Optional: ?lang=en auf /en/ umleiten ------------------------------------
map $arg_lang $kiventis_lang_redirect {
    default "";
    "en"    "/en/";
    "EN"    "/en/";
}

server {
    listen 443 ssl;
    http2 on;
    server_name kiventis.com www.kiventis.com;

    root /var/www/kiventis;
    index index.html;

    # ... TLS-Konfiguration unverändert übernehmen ...

    if ($kiventis_lang_redirect) {
        return 301 $kiventis_lang_redirect;
    }

    # ---------------------------------------------------------------- Startseite
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location = /en/ {
        try_files /en/index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location = /impressum.html {
        try_files /impressum.html =404;
    }

    location = /datenschutz.html {
        try_files /datenschutz.html =404;
    }

    # ------------------------------------------------------------ Statische Assets
    location ^~ /assets/fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ^~ /assets/ {
        # Deckt sowohl neue Dateien (styles.css, *.svg) als auch die gehashten
        # Bundles der bestehenden App ab.
        try_files $uri @spa_asset;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(svg|png|jpg|webp|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # --------------------------------------------------- Demos (statisch)
    # Die vier Showcases: zwei neue Export-Pipelines und die Übersichtsseite
    # werden als statische Dateien ausgeliefert, die alten Demos
    # (/beispiele/bom-designer, /beispiele/rechnungspruefer) bleiben in der App.
    location = /beispiele/ {
        try_files /beispiele/index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location ^~ /beispiele/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location ^~ /beispiele/fi-rfbibl00/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location ^~ /beispiele/preise-konditionen/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ------------------------------------------------- Bestehende App (SPA)
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        try_files /app.html =404;
        add_header Cache-Control "no-cache";
    }

    location @spa_asset {
        try_files /app.html =404;
    }

    # ------------------------------------------------------------------ Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Wichtig: add_header wird in nginx nicht vererbt, sobald eine location
    # selbst add_header setzt (z. B. Cache-Control). Ohne diese Zeile verlieren
    # /, /en/ und /beispiele/ die CSP und die Security-Header.
    # Verfügbar ab nginx 1.29.3 – auf dem Server läuft 1.31.7.
    add_header_inherit merge;

    # CSP: keine externen Quellen mehr nötig (Schriften liegen lokal).
    # Der Hash erlaubt ausschließlich den JSON-LD-Block der Startseite.
    # Neu berechnen nach Änderungen am JSON-LD:
    #   python3 - <<'EOF'
    #   import re,hashlib,base64
    #   s=open('index.html').read()
    #   m=re.search(r'<script type="application/ld\+json">(.*?)</script>',s,re.S)
    #   print(base64.b64encode(hashlib.sha256(m.group(1).encode()).digest()).decode())
    #   EOF
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self' 'sha256-KmGt3ccqXvl19Kr88wzp5/6OHZkP2uXPfPe6N7i2poo='; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;
}
